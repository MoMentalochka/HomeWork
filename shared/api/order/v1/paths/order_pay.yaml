parameters:
  - $ref: "../params/uuid.yaml"

post:
  summary: Request for order payment
  operationId: OrderPay
  tags: [orders]
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../components/pay/order_pay_request.yaml"

  responses:
    '200':
      description: The order has been successfully paid for
      content:
        application/json:
          schema:
            $ref: "../components/pay/order_pay_response.yaml"
    '404':
      description: The order was not found
      content:
        application/json:
          schema:
            $ref: "../components/errors/not_found.yaml"
    '409':
      description: The order has already been paid or cancelled for and cannot be paid
      content:
        application/json:
          schema:
            $ref: "../components/errors/conflict.yaml"