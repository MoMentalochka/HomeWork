type: object
required:
  - order_uuid
  - part_uuids
  - user_uuid
  - total_price
  - transaction_uuid
  - payment_method
  - status
properties:
  order_uuid:
    type: string
    description: Order ID
    example: "order_uuid"
  user_uuid:
    type: string
    description: User ID
    example: "user_uuid"
  part_uuids:
    type: array
    description: Parts Id array
    items:
      type: string
      example: "part_uuid"
  total_price:
    description: Total price
    type: number
    example: 123.45
  transaction_uuid:
    description: User ID
    type: string
    example: "transaction_uuid"
  payment_method:
    $ref: "./enums/payment_method.yaml"
  status:
    $ref: "./enums//status.yaml"