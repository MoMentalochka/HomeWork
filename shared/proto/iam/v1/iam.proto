syntax = "proto3";

package iam.v1;

option go_package = "github.com/MoMentalochka/HomeWork/user/pkg/proto/user/v1;iam_v1";

// IamService
service IamService {
  // Register
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login
  rpc Login(LoginRequest) returns (LoginResponse);
  // Whoami
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
  // GetUser
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}
// Register
// RegisterRequest
message RegisterRequest {
  string login = 1;
  string password = 2;
  string email = 3;
  NotificationMethod notification_methods = 4;
}
// NotificationMethod
message NotificationMethod {
  string provider_name = 1;
  string target = 2;
}
// RegisterResponse
message RegisterResponse {
  string user_uuid = 1;
}

// Login
// LoginRequest
message LoginRequest {
  string login = 1;
  string password = 2;
}
// LoginResponse
message LoginResponse {
  string session_uuid = 1;
}


// Whoami
// WhoamiRequest
message WhoamiRequest {
  string session_uuid = 1;
}
// WhoamiResponse
message WhoamiResponse {
  string user_uuid = 1;
  string login = 2;
  string email = 3;
}

// GetUser
// GetUserRequest
message GetUserRequest {
  string user_uuid = 1;
}
// GetUserResponse
message GetUserResponse {
  string user_uuid = 1;
  string login = 2;
  string email = 3;
  NotificationMethod notification_methods = 4;
}